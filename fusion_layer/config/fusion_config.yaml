fusion:
  primary_method: logistic_regression_stacking
  baseline_method: soft_voting

thresholds:
  final_label: 0.50
  low_risk_max: 0.30
  medium_risk_max: 0.70

preprocessing:
  missing_probability_imputation: 0.50
  require_at_least_one_modality: true

artifacts:
  model_path: artifacts/logistic_fusion_model.joblib
  metadata_path: artifacts/logistic_fusion_metadata.json

logistic_regression:
  C: 1.0
  solver: liblinear
  max_iter: 1000
  random_state: 42

integration:
  join_type: outer
  # Optional: configure default output file locations
  # outputs:
  #   predictions: /path/to/custom/predictions.csv
  #   assembled_input: /path/to/custom/assembled_input.csv
  #   manifest: /path/to/custom/manifest.json
  sources:
    header:
      location: data/sample_header_scores.csv
      # Optional override if the upstream header model uses a different ID column name.
      # email_id_column: message_id
      # Optional override if the upstream header model uses a different score column name.
      # score_column: header_probability
    body:
      location: data/sample_body_scores.csv
      # email_id_column: email_id
      # score_column: body_score
    malware:
      location: data/sample_malware_scores.csv
      # email_id_column: email_id
      # score_column: attachment_score
  duplicate_strategy:
    header: error
    body: error
    malware: max
  processed_emails:
    incremental: true
    state_path: artifacts/processed_emails_state.json
    required_models:
      - header
      - body
    per_email_output_filename: fusion_output.json
