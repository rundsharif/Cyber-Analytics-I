<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fusion Layer Test Console (Local + S3)</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Fusion Layer Test Console (Local + S3)</h1>
        <p>
          Localhost utility for running fusion inference from either local model-output CSVs or S3
          CSVs, with optional output write-back to S3 and/or local artifacts.
        </p>
      </header>

      <section class="card">
        <h2>Run Fusion Job</h2>
        <form id="fusion-form">
          <div class="grid">
            <label>
              Input Source
              <select id="input_source">
                <option value="local" selected>Local CSV (local model outputs)</option>
                <option value="s3">S3 (cloud output files)</option>
              </select>
            </label>

            <label class="checkbox-row">
              <input type="checkbox" id="use_latest_from_prefix" />
              For S3 source: use latest CSV from prefix
            </label>

            <label>
              S3 Source Bucket (latest-from-prefix mode)
              <input type="text" id="source_bucket" placeholder="your-source-bucket" />
            </label>

            <label>
              S3 Source Prefix (latest-from-prefix mode)
              <input type="text" id="source_prefix" placeholder="parsed/fusion-input/" />
            </label>

            <label>
              Last Seen S3 Key (optional, skip if unchanged)
              <input type="text" id="last_seen_key" placeholder="parsed/fusion-input/live_batch_002.csv" />
            </label>

            <label class="checkbox-row">
              <input type="checkbox" id="enable_polling" />
              Auto-poll latest S3 prefix
            </label>

            <label>
              Poll Interval Seconds
              <input type="number" id="poll_interval_seconds" min="3" value="15" />
            </label>

            <label>
              Input S3 URI
              <input type="text" id="input_s3_uri" placeholder="s3://bucket/fusion-input/inference.csv" />
            </label>

            <label>
              Local Input CSV Path (used when source=local)
              <input type="text" id="local_input_path" placeholder="data/sample_fusion_inference.csv" />
            </label>

            <label>
              Fusion Method
              <select id="fusion_method">
                {% for method in supported_methods %}
                <option value="{{ method }}">{{ method }}</option>
                {% endfor %}
              </select>
            </label>

            <label>
              Model Artifact URI (optional for soft_voting)
              <input type="text" id="model_artifact_uri" placeholder="s3://bucket/artifacts/logistic_fusion_model.joblib" />
            </label>

            <label>
              Output S3 URI (optional)
              <input type="text" id="output_s3_uri" placeholder="s3://bucket/fusion-output/predictions.csv" />
            </label>

            <label>
              Output Bucket (optional)
              <input type="text" id="output_bucket" placeholder="bucket-name" />
            </label>

            <label>
              Output Prefix (optional)
              <input type="text" id="output_prefix" placeholder="fusion-output" />
            </label>

            <label>
              Local Output CSV Path (optional)
              <input type="text" id="local_output_path" placeholder="artifacts/web_app_predictions.csv" />
            </label>

            <label class="checkbox-row">
              <input type="checkbox" id="write_output_to_s3" />
              Write predictions to S3
            </label>

            <label class="checkbox-row">
              <input type="checkbox" id="write_output_local" checked />
              Write predictions to local CSV
            </label>
          </div>

          <div class="actions">
            <button type="submit">Run Fusion</button>
            <button type="button" id="stop-polling" class="secondary">Stop Auto Polling</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Result</h2>
        <pre id="result-meta">No job run yet.</pre>
      </section>

      <section class="card">
        <h2>Prediction Preview</h2>
        <div class="table-wrap">
          <table id="preview-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
